<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/main.css">

<style>
:root { --art-side:180px; }
@media(max-width:900px){ :root { --art-side:60px; } }
@media(max-width:600px){ :root { --art-side:20px; } }

/* Simple top bar (jo navbar) */
.kat-topbar { background:#111; height:52px; display:flex; align-items:center; padding:0 24px; gap:14px; position:sticky; top:0; z-index:200; }
.kat-logo { background:#C8003E; padding:3px 10px; border-radius:4px; font-weight:900; font-size:13px; color:#fff; letter-spacing:-.5px; }
.kat-label { font-size:10px; color:#555; letter-spacing:2px; text-transform:uppercase; }

/* Page header */
.pg-header { padding:10px var(--side) 8px; border-bottom:.5px solid var(--border); display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.pg-breadcrumb { font-size:12px; font-weight:500; letter-spacing:.5px; color:var(--black); text-transform:uppercase; }
#pg-count { font-size:11px; color:var(--muted); letter-spacing:1px; white-space:nowrap; }

/* Filter bar */
#dyn-filter-bar { background:#fff; border-bottom:.5px solid var(--border); padding:0 var(--art-side); display:flex; flex-direction:column; }
@media(max-width:600px){ #dyn-filter-bar { padding:0 14px; } }
.dfc-row { display:flex; flex-wrap:nowrap; gap:6px; padding:8px 0; align-items:center; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.dfc-row::-webkit-scrollbar { display:none; }
.dfc-row-sub { gap:2px; }
.dfc-sub { background:none; border:none; padding:3px 8px; font-size:9px; font-weight:500; letter-spacing:.8px; text-transform:uppercase; cursor:pointer; color:var(--muted); transition:color .15s; white-space:nowrap; flex-shrink:0; }
.dfc-sub:hover { color:var(--black); }
.dfc-sub.active { color:var(--black); text-decoration:underline; text-underline-offset:3px; }
.dfc { padding:4px 12px; border:.5px solid var(--border); background:#fff; font-size:10px; font-weight:500; letter-spacing:.8px; text-transform:uppercase; cursor:pointer; transition:all .15s; white-space:nowrap; flex-shrink:0; }
.dfc:hover { border-color:var(--black); }
.dfc.active { background:var(--black); color:#fff; border-color:var(--black); }

/* Grid */
#dyn-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:44px 36px; padding:24px var(--art-side) 80px; }
@media(max-width:900px){ #dyn-grid { grid-template-columns:repeat(3,1fr); gap:36px 28px; } }
@media(max-width:600px){ #dyn-grid { grid-template-columns:repeat(2,1fr); gap:20px 12px; padding:var(--side) var(--side) 50px; } .art-card-name{font-size:10px!important;letter-spacing:0!important;} .art-card-code{font-size:8.5px!important;letter-spacing:1px!important;} }

/* Card */
.art-card { cursor:pointer; position:relative; }
.art-card-img-wrap { aspect-ratio:3/4; overflow:hidden; background:#f0f0f0; position:relative; }
.art-card-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
.art-card-arr { position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;padding:0;cursor:pointer;font-size:20px;line-height:1;opacity:0;transition:opacity .15s;pointer-events:none;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6); }
.art-card:hover .art-card-arr { opacity:1; pointer-events:auto; }
.art-card-arr.l { left:8px; } .art-card-arr.r { right:8px; }

/* Prices on card — same line, same size */
.card-prices { padding:4px 10px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.card-price-tregu { font-size:13px; font-weight:600; color:#bbb; text-decoration:line-through; letter-spacing:-.2px; }
.card-price-oferte { font-size:13px; font-weight:700; color:#C8003E; letter-spacing:-.2px; }

/* Article popup */
#art-detail-overlay { display:none; position:fixed; inset:0; z-index:9000; background:rgba(255,255,255,.95); backdrop-filter:blur(8px); align-items:center; justify-content:center; padding:1.2rem; }
#art-detail-box { background:#fff; border-radius:6px; width:min(1260px,96vw); height:min(820px,92vh); display:grid; grid-template-columns:58% 42%; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.45); position:relative; }
#art-detail-photos { background:#f5f5f5; overflow:hidden; position:relative; display:flex; align-items:flex-start; justify-content:center; }
#det-main-wrap { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
#det-main-wrap img { object-fit:contain!important; width:100%!important; height:100%!important; display:block; object-position:center top!important; }
@media(min-width:701px) and (max-width:1199px){ #art-detail-box { grid-template-columns:55% 45%; width:98vw; height:90vh; } }
.art-det-side { display:flex; flex-direction:column; height:100%; }
.art-det-info { flex:1; overflow-y:auto; padding:24px 28px 12px; }
.art-det-info::-webkit-scrollbar { width:4px; } .art-det-info::-webkit-scrollbar-thumb { background:#ddd; }
.art-det-footer { padding:14px 28px 20px; flex-shrink:0; border-top:.5px solid var(--border); display:flex; gap:8px; }
.art-nav-btn { position:fixed; top:50%; background:none; border:none; color:#aaa; width:32px; height:32px; font-size:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:9100; padding:0; }
.art-nav-btn:disabled { opacity:.25; cursor:default; }
.art-nav-btn.prev { left:calc(50% - min(630px,48vw) + 14px); }
.art-nav-btn.next { right:calc(50% - min(630px,48vw) + 14px); }
@media(max-width:700px){ .art-nav-btn { top:16px!important; } .art-nav-btn.prev { left:14px; } .art-nav-btn.next { right:14px; } }
#art-det-thumbs { position:absolute; bottom:0; left:0; right:0; display:flex; gap:6px; padding:10px 14px; background:linear-gradient(transparent,rgba(0,0,0,.6)); overflow-x:auto; scrollbar-width:none; }
#art-det-thumbs::-webkit-scrollbar { display:none; }
.det-th { width:52px; height:52px; border-radius:3px; object-fit:cover; border:2px solid transparent; cursor:pointer; flex-shrink:0; opacity:.7; }
.det-th:hover { opacity:1; }
.det-th.active { border-color:#fff; opacity:1; }

/* Price block inside popup — same line, same size */
.popup-prices { margin:14px 0 6px; padding:12px 16px; background:#fafafa; border-radius:6px; border:.5px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pp-label { font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#bbb; margin-right:2px; }
.pp-tregu-val { font-size:18px; font-weight:600; color:#bbb; text-decoration:line-through; letter-spacing:-.3px; }
.pp-arrow { font-size:14px; color:#ccc; }
.pp-oferte-val { font-size:18px; font-weight:800; color:#C8003E; letter-spacing:-.3px; }

/* Mobile popup */
@media(max-width:700px){
  #art-detail-overlay { padding:2px 0 0!important; align-items:flex-end!important; overflow:hidden; }
  #art-detail-box { grid-template-columns:1fr!important; grid-template-rows:auto 1fr!important; width:100vw!important; height:calc(100vh - 2px)!important; border-radius:10px 10px 0 0!important; box-shadow:none!important; overflow:hidden!important; max-width:100vw!important; }
  #art-detail-photos { width:100vw!important; height:auto!important; max-height:60vh!important; position:relative!important; overflow:hidden!important; }
  #det-main-wrap { position:relative!important; width:100%!important; height:auto!important; }
  #det-main-wrap img { width:100%!important; height:auto!important; max-height:60vh!important; display:block!important; object-fit:cover!important; object-position:center top!important; }
  #art-det-thumbs { position:absolute!important; bottom:0!important; left:0!important; right:0!important; z-index:2!important; }
  .det-th { width:40px!important; height:40px!important; }
}

/* Footer */
.simple-footer { background:#111; color:#fff; padding:32px var(--side) 24px; }
.contact-locations { display:flex; gap:32px; flex-wrap:wrap; margin-bottom:20px; }
.contact-loc-name { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#555; margin-bottom:4px; }
.contact-loc-addr { font-size:12px; color:#888; line-height:1.5; }
.contact-footer { border-top:.5px solid #222; padding-top:16px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#444; }
.contact-brand { font-weight:700; letter-spacing:.5px; color:#555; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="kat-topbar">
  <span class="kat-logo">intal</span>
  <span class="kat-label">Katalog Çmimesh</span>
  <div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px;">
    <div id="search-wrap" style="display:flex;align-items:center;gap:6px;background:#1e1e1e;border-radius:20px;padding:4px 12px;transition:all .2s;">
      <i class="ri-search-line" style="color:#555;font-size:14px;flex-shrink:0;"></i>
      <input id="search-input" type="text" placeholder="Kërko..." autocomplete="off"
        style="background:none;border:none;outline:none;color:#fff;font-size:12px;width:130px;font-family:inherit;"
        oninput="doSearch(this.value)"
        onkeydown="if(event.key==='Escape'){this.value='';doSearch('');this.blur();}">
      <button id="search-clear" onclick="document.getElementById('search-input').value='';doSearch('');document.getElementById('search-input').focus();"

<script>
var _arts = [];
var _prices = {};      // { id: { tregu:'', oferte:'' } }
var _currency = 'ALL';
var _katSettings = [];
var _activeSub = 'te-gjitha';
var _activeKat = 'te-gjitha';
var _openList = [];
var _openIdx = 0;
var _PG_SIZE = 16;
var _pgShown = 0;
var _pgList = [];

function getPhotoSrc(p){ if(!p) return ''; if(typeof p==='string') return p; return p.src||p.url||''; }

// ── Load data ──────────────────────────────────────────
async function init(){
  // Always force-refresh so client always sees the latest articles
  try{ localStorage.removeItem('intal_cache_ts'); }catch(e){}
  await sbSyncCache();
  var cache = {};
  try{ cache = JSON.parse(localStorage.getItem('intal_cache_v1')||'{}'); }catch(e){}
  _arts = cache.artikujt || [];
  _katSettings = cache.kategoriSettings || [];

  if(!_arts.length){
    var raw = await sbGet('artikujt');
    if(raw) try{ _arts = JSON.parse(raw); }catch(e){}
  }

  // Load prices + currency
  var pr = await sbGet('katalog_cmime');
  if(pr){
    try{
      var obj = JSON.parse(pr);
      if(obj._currency){ _currency = obj._currency; _prices = obj.prices || {}; }
      else { _prices = obj; }
    }catch(e){}
  }

  buildFilterBar();
  renderGridAll(_arts, _activeSub, _activeKat);
}

// ── Filter helpers — supports both sub/kat and gjinia/kategoria fields ──
function getArtSubs(a){
  var s = (a.sub&&(Array.isArray(a.sub)?a.sub.length:a.sub)) ? a.sub : a.gjinia;
  if(!s) return [];
  if(Array.isArray(s)) return s.filter(Boolean);
  return [s];
}
function getArtKats(a){
  var k = (a.kat&&(Array.isArray(a.kat)?a.kat.length:a.kat)) ? a.kat : a.kategoria;
  if(!k) return [];
  if(Array.isArray(k)) return k.filter(Boolean);
  return [k];
}
function artMatchesCat(a, cat){
  return getArtSubs(a).some(function(x){ return (x||'').toLowerCase()===cat.toLowerCase(); });
}
function artKatArr(a){ return getArtKats(a); }
function artMatchesKat(a, kat){ return getArtKats(a).some(function(x){ return (x||'').toLowerCase()===kat.toLowerCase(); }); }
function artMatchesQuery(a, q){
  var lq = q.toLowerCase();
  if((a.name||'').toLowerCase().indexOf(lq)>-1) return true;
  if((a.code||'').toLowerCase().indexOf(lq)>-1) return true;
  if(getArtKats(a).some(function(k){ return k.toLowerCase().indexOf(lq)>-1; })) return true;
  if(getArtSubs(a).some(function(s){ return s.toLowerCase().indexOf(lq)>-1; })) return true;
  return false;
}

// ── Search ─────────────────────────────────────────────
function doSearch(q){
  var clr = document.getElementById('search-clear');
  if(clr) clr.style.display = q ? 'inline' : 'none';
  var bar = document.getElementById('dyn-filter-bar');
  if(q){
    if(bar) bar.style.display = 'none';
    var found = _arts.filter(function(a){ return artMatchesQuery(a, q); });
    document.getElementById('pg-count').textContent = found.length+' ARTIKUJ';
    _pgList = found; _pgShown = 0;
    _pgRender(false);
  } else {
    if(bar) bar.style.display = 'flex';
    renderGridAll(_arts, _activeSub, _activeKat);
  }
}

// ── Filter bar (identical structure to artikujt.html) ─
function buildFilterBar(){
  var bar = document.getElementById('dyn-filter-bar');
  // Collect unique sub (gjinia) values
  var subs = [];
  _arts.forEach(function(a){
    getArtSubs(a).forEach(function(v){ v=(v||'').trim(); if(v && subs.indexOf(v)===-1) subs.push(v); });
  });
  // Row 1: "Të Gjitha" + gjinia buttons
  var row1 = '<div class="dfc-row">';
  row1 += '<button class="dfc'+((!_activeSub||_activeSub==='te-gjitha')?' active':'')+'" onclick="setSub(\'te-gjitha\')">Të Gjitha</button>';
  subs.forEach(function(s){
    row1 += '<button class="dfc'+(s===_activeSub?' active':'')+'" data-sub="'+escHtml(s)+'" onclick="setSub(\''+s.replace(/'/g,"\\'")+'\')">'+s+'</button>';
  });
  row1 += '</div>';
  // Row 2: kat buttons — only visible when a gjinia is selected
  var row2 = '';
  if(_activeSub && _activeSub!=='te-gjitha'){
    var subArts = _arts.filter(function(a){ return artMatchesCat(a, _activeSub); });
    var kats = [];
    subArts.forEach(function(a){ getArtKats(a).forEach(function(k){ k=(k||'').trim(); if(k && kats.indexOf(k)===-1) kats.push(k); }); });
    if(kats.length){
      row2 = '<div class="dfc-row dfc-row-sub">';
      kats.forEach(function(k){
        row2 += '<button class="dfc-sub'+(k===_activeKat?' active':'')+'" data-kat="'+escHtml(k)+'" onclick="setKat(\''+k.replace(/'/g,"\\'")+'\')">'+k+'</button>';
      });
      row2 += '</div>';
    }
  }
  bar.innerHTML = row1 + row2;
  bar.style.display = 'flex';
}

function setSub(val){
  _activeSub = (val==='te-gjitha') ? 'te-gjitha' : ((_activeSub===val) ? 'te-gjitha' : val);
  _activeKat = 'te-gjitha';
  buildFilterBar();
  renderGridAll(_arts, _activeSub, _activeKat);
}
function setKat(val){
  _activeKat = (_activeKat===val) ? 'te-gjitha' : val;
  buildFilterBar();
  renderGridAll(_arts, _activeSub, _activeKat);
}

// ── Grid rendering ────────────────────────────────────
function renderGridAll(list, sub, kat){
  var show = list;
  if(sub && sub!=='te-gjitha') show = show.filter(function(a){ return artMatchesCat(a, sub); });
  if(kat && kat!=='te-gjitha') show = show.filter(function(a){ return artMatchesKat(a, kat); });
  document.getElementById('pg-count').textContent = show.length+' ARTIKUJ';
  _pgList = show; _pgShown = 0;
  _pgRender(false);
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function _pgRender(append){
  var grid = document.getElementById('dyn-grid');
  var wrap = document.getElementById('load-more-wrap');
  var slice = _pgList.slice(append ? _pgShown : 0, _pgShown + _PG_SIZE);
  if(!append){
    if(!_pgList.length){ grid.innerHTML='<div style="grid-column:1/-1;padding:80px 0;text-align:center;color:var(--muted);font-size:13px;">Nuk ka artikuj.</div>'; wrap.style.display='none'; _pgShown=0; return; }
    grid.innerHTML = slice.map(buildCard).join('');
    _pgShown = slice.length;
  } else {
    grid.innerHTML += slice.map(buildCard).join('');
    _pgShown += slice.length;
  }
  wrap.style.display = _pgShown < _pgList.length ? 'block' : 'none';
}
window.loadMoreArts = function(){ _pgRender(true); };

function buildCard(a){
  var photos = (a.photos||[]).map(getPhotoSrc).filter(Boolean);
  var img0 = photos[0]||'';
  var hasM = photos.length>1;
  var pa = hasM?' data-photos=\''+JSON.stringify(photos).replace(/'/g,'&#39;')+'\'':'';
  var imgEl = img0
    ? '<img src="'+img0+'" data-idx="0" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy">'
    : '<div style="width:100%;height:100%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:40px;">&#128085;</div>';
  var hoverAttr = hasM?' onmouseenter="hoverEnter(this)" onmouseleave="hoverLeave(this)"':'';
  var arr = hasM?'<button class="art-card-arr l" onclick="cardStep(event,this,-1)">&#8592;</button><button class="art-card-arr r" onclick="cardStep(event,this,1)">&#8594;</button>':'';

  var pr = _prices[a.id]||{};
  var cur = _currency || 'ALL';
  var priceHtml = '';
  if(pr.tregu || pr.oferte){
    priceHtml = '<div class="card-prices">'
      +(pr.tregu?'<span class="card-price-tregu">'+pr.tregu+' '+cur+'</span>':'')
      +(pr.tregu && pr.oferte?'<span style="color:#ccc;font-size:12px;">→</span>':'')
      +(pr.oferte?'<span class="card-price-oferte">'+pr.oferte+' '+cur+'</span>':'')
      +'</div>';
  }

  return '<div class="art-card" onclick="openDet(\''+a.id+'\')">'
    +'<div class="art-card-img-wrap"'+pa+hoverAttr+'>'+imgEl+arr+'</div>'
    +'<div style="padding:6px 10px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">'
    +'<p class="art-card-name" style="font-size:13px;font-weight:500;letter-spacing:-.2px;color:var(--black);margin:0;word-break:break-word;">'+a.name+'</p>'
    +(a.code?'<p class="art-card-code" style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0;white-space:nowrap;flex-shrink:0;padding-top:1px;">Art: '+a.code+'</p>':'')
    +'</div>'
    +priceHtml
    +'</div>';
}

// ── Card hover/swipe ─────────────────────────────────
var _hoverTimers = {};
window.hoverEnter = function(wrap){
  var photos = JSON.parse(wrap.dataset.photos||'[]');
  if(photos.length<2) return;
  var idx = 0;
  _hoverTimers[wrap] = setInterval(function(){
    idx = (idx+1)%photos.length;
    var img = wrap.querySelector('img');
    if(img){ img.src=photos[idx]; img.dataset.idx=idx; }
  }, 900);
};
window.hoverLeave = function(wrap){
  clearInterval(_hoverTimers[wrap]);
  var photos = JSON.parse(wrap.dataset.photos||'[]');
  if(photos[0]){ var img=wrap.querySelector('img'); if(img){ img.src=photos[0]; img.dataset.idx=0; } }
};

window.cardStep = function(e, btn, dir){
  e.stopPropagation();
  var wrap = btn.parentElement;
  var idx = parseInt(wrap.querySelector('img').dataset.idx||0);
  var photos = JSON.parse(wrap.dataset.photos||'[]');
  var ni = (idx+dir+photos.length)%photos.length;
  wrap.querySelector('img').src = photos[ni];
  wrap.querySelector('img').dataset.idx = ni;
};

// ── Popup ─────────────────────────────────────────────
window.openDet = function(id){
  var a = _arts.find(function(x){ return x.id===id; });
  if(!a) return;
  _openList = _pgList;
  _openIdx = _pgList.findIndex(function(x){ return x.id===id; });
  renderPopup(a);
  var ov = document.getElementById('art-detail-overlay');
  ov.style.display='flex';
  document.body.style.overflow='hidden';
  updateNavBtns();
};

function renderPopup(a){
  var photos = (a.photos||[]).map(getPhotoSrc).filter(Boolean);
  var idx = 0;
  document.getElementById('art-detail-kat').textContent = [getArtKats(a).join(', '), getArtSubs(a).join(', ')].filter(Boolean).join(' · ').toUpperCase();
  document.getElementById('art-detail-code').textContent = a.code ? 'KOD: '+a.code : '';
  document.getElementById('art-detail-name').textContent = a.name||'';
  document.getElementById('art-detail-desc').textContent = a.pershkrim||'';

  // Prices
  var pr = _prices[a.id]||{};
  var cur = _currency || 'ALL';
  var ppEl = document.getElementById('popup-prices');
  if(pr.tregu || pr.oferte){
    document.getElementById('pp-tregu-val').textContent = pr.tregu ? pr.tregu+' '+cur : '';
    document.getElementById('pp-oferte-val').textContent = pr.oferte ? pr.oferte+' '+cur : '';
    document.querySelector('.pp-arrow').style.display = (pr.tregu && pr.oferte) ? '' : 'none';
    ppEl.style.display = 'flex';
  } else {
    ppEl.style.display = 'none';
  }

  // Sizes
  var masatEl = document.getElementById('art-detail-masat');
  if(a.sizes && a.sizes.length){
    masatEl.innerHTML = '<p style="font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;">MASAT</p>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px;">'+a.sizes.map(function(s){
        return '<span style="padding:6px 14px;border:.5px solid var(--border);border-radius:2px;font-size:11px;font-weight:500;letter-spacing:.5px;">'+s+'</span>';
      }).join('')+'</div>';
  } else { masatEl.innerHTML=''; }

  // Colors
  var ngj = document.getElementById('art-detail-ngjyrat');
  if(a.ngjyrat && a.ngjyrat.length){
    ngj.innerHTML='<p style="font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;">NGJYRAT</p>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px;">'+a.ngjyrat.map(function(c){
        return '<span style="padding:4px 10px;border:.5px solid var(--border);font-size:11px;">'+c+'</span>';
      }).join('')+'</div>';
  } else { ngj.innerHTML=''; }

  // Photos
  var mi = photos.length
    ? '<img src="'+photos[idx]+'" style="width:100%;height:100%;object-fit:contain;display:block;">'
    : '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:60px;">&#128085;</div>';
  var th = '';
  if(photos.length>1){
    th='<div id="art-det-thumbs">'+photos.map(function(ph,i){
      return '<img src="'+ph+'" class="det-th'+(i===0?' active':'')+'" onclick="setPI('+i+')" alt="">';
    }).join('')+'</div>';
  }
  document.getElementById('art-detail-photos').innerHTML='<div id="det-main-wrap">'+mi+'</div>'+th;
}

window.setPI = function(i){
  var photos = Array.from(document.querySelectorAll('.det-th')).map(function(t){ return t.src; });
  if(!photos.length) return;
  var wrap = document.getElementById('det-main-wrap');
  if(wrap) { var img=wrap.querySelector('img'); if(img) img.src=photos[i]; }
  document.querySelectorAll('.det-th').forEach(function(t,j){ t.classList.toggle('active',j===i); });
};

window.closeArtDetail = function(){
  document.getElementById('art-detail-overlay').style.display='none';
  document.body.style.overflow='';
};

window.navArt = function(dir){
  _openIdx = Math.max(0, Math.min(_openList.length-1, _openIdx+dir));
  renderPopup(_openList[_openIdx]);
  updateNavBtns();
};

function updateNavBtns(){
  document.getElementById('art-prev-btn').disabled = _openIdx<=0;
  document.getElementById('art-next-btn').disabled = _openIdx>=_openList.length-1;
}

document.addEventListener('keydown', function(e){
  var ov = document.getElementById('art-detail-overlay');
  if(ov.style.display!=='flex') return;
  if(e.key==='Escape') closeArtDetail();
  if(e.key==='ArrowLeft') navArt(-1);
  if(e.key==='ArrowRight') navArt(1);
});

init();
</script>
</body>
</html>
