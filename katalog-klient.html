<style>
:root { --art-side:180px; }
@media(max-width:900px){ :root { --art-side:60px; } }
@media(max-width:600px){ :root { --art-side:20px; } }

/* Simple top bar (jo navbar) */
.kat-topbar { background:#111; height:52px; display:flex; align-items:center; padding:0 24px; gap:14px; position:sticky; top:0; z-index:200; }
.kat-logo { background:#C8003E; padding:3px 10px; border-radius:4px; font-weight:900; font-size:13px; color:#fff; letter-spacing:-.5px; }
.kat-label { font-size:10px; color:#555; letter-spacing:2px; text-transform:uppercase; }

/* Page header */
.pg-header { padding:10px var(--side) 8px; border-bottom:.5px solid var(--border); display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.pg-breadcrumb { font-size:12px; font-weight:500; letter-spacing:.5px; color:var(--black); text-transform:uppercase; }
#pg-count { font-size:11px; color:var(--muted); letter-spacing:1px; white-space:nowrap; }

/* Filter bar */
#dyn-filter-bar { background:#fff; border-bottom:.5px solid var(--border); padding:0 var(--art-side); display:flex; flex-direction:column; }
@media(max-width:600px){ #dyn-filter-bar { padding:0 14px; } }
.dfc-row { display:flex; flex-wrap:nowrap; gap:6px; padding:8px 0; align-items:center; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.dfc-row::-webkit-scrollbar { display:none; }
.dfc-row-sub { gap:2px; }
.dfc-sub { background:none; border:none; padding:3px 8px; font-size:9px; font-weight:500; letter-spacing:.8px; text-transform:uppercase; cursor:pointer; color:var(--muted); transition:color .15s; white-space:nowrap; flex-shrink:0; }
.dfc-sub:hover { color:var(--black); }
.dfc-sub.active { color:var(--black); text-decoration:underline; text-underline-offset:3px; }
.dfc { padding:4px 12px; border:.5px solid var(--border); background:#fff; font-size:10px; font-weight:500; letter-spacing:.8px; text-transform:uppercase; cursor:pointer; transition:all .15s; white-space:nowrap; flex-shrink:0; }
.dfc:hover { border-color:var(--black); }
.dfc.active { background:var(--black); color:#fff; border-color:var(--black); }

/* Grid */
#dyn-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:44px 36px; padding:24px var(--art-side) 80px; }
@media(max-width:900px){ #dyn-grid { grid-template-columns:repeat(3,1fr); gap:36px 28px; } }
@media(max-width:600px){ #dyn-grid { grid-template-columns:repeat(2,1fr); gap:20px 12px; padding:var(--side) var(--side) 50px; } .art-card-name{font-size:10px!important;letter-spacing:0!important;} .art-card-code{font-size:8.5px!important;letter-spacing:1px!important;} }

/* Card */
.art-card { cursor:pointer; position:relative; }
.art-card-img-wrap { aspect-ratio:3/4; overflow:hidden; background:#f0f0f0; position:relative; }
.art-card-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
.art-card-arr { position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;padding:0;cursor:pointer;font-size:20px;line-height:1;opacity:0;transition:opacity .15s;pointer-events:none;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6); }
.art-card:hover .art-card-arr { opacity:1; pointer-events:auto; }
.art-card-arr.l { left:8px; } .art-card-arr.r { right:8px; }

/* Prices on card — same line, same size */
.card-prices { padding:4px 10px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.card-price-tregu { font-size:13px; font-weight:600; color:#bbb; text-decoration:line-through; letter-spacing:-.2px; }
.card-price-oferte { font-size:13px; font-weight:700; color:#C8003E; letter-spacing:-.2px; }

/* ── Article popup overlay ── */
#art-detail-overlay { display:none; position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); align-items:center; justify-content:center; padding:16px; }

/* ── Popup box — scrollable wrapper ── */
#art-detail-box { background:#fff; border-radius:8px; width:min(1100px,96vw); max-height:94vh; overflow-y:auto; overflow-x:hidden; box-shadow:0 32px 80px rgba(0,0,0,.35); position:relative; scrollbar-width:thin; scrollbar-color:#ddd #fff; }
#art-detail-box::-webkit-scrollbar { width:4px; }
#art-detail-box::-webkit-scrollbar-thumb { background:#ddd; }

/* ── Close button ── */
#det-close-btn { position:sticky; top:0; right:0; z-index:10; float:right; margin:12px 12px 0 0; background:#f0f0f0; border:none; border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* ── Product grid inside popup (mirrors .product-grid on /artikull/) ── */
.det-product-grid { display:flex; gap:clamp(8px,1.2vw,18px); align-items:flex-start; padding:16px 20px 24px; clear:both; }

/* Thumbs column */
.det-thumbs-col { width:clamp(56px,5.5vw,80px); flex-shrink:0; display:flex; flex-direction:column; gap:6px; align-self:flex-start; }
.det-th { border:2px solid transparent; overflow:hidden; width:100%; aspect-ratio:1; cursor:pointer; padding:0; background:none; display:block; transition:border-color .15s; }
.det-th.active { border-color:#C8003E; }
.det-th img { width:100%; height:100%; object-fit:cover; display:block; }

/* Gallery */
.det-gallery { flex:3; min-width:0; align-self:flex-start; }
.det-main-img-wrap { position:relative; background:#fff; aspect-ratio:3/4; overflow:hidden; }
.det-main-img-wrap img { width:100%; height:100%; object-fit:contain; display:block; }
.det-main-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:72px; color:#ddd; }
.det-gallery-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.9); border:none; width:36px; height:36px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.12); }
.det-gallery-nav.prev { left:10px; }
.det-gallery-nav.next { right:10px; }
.det-gallery-nav:hover { background:#fff; }

/* Info panel */
.det-info { flex:1.6; min-width:0; align-self:flex-start; }
.det-info-eyebrow { font-size:9px; letter-spacing:2.5px; text-transform:uppercase; color:#aaa; margin-bottom:6px; }
.det-info-name { font-size:clamp(17px,1.8vw,22px); font-weight:800; letter-spacing:-.3px; line-height:1.2; margin-bottom:4px; color:#0a0a0a; }
.det-divider { height:1px; background:#ebebeb; margin:14px 0 20px; }
.det-section-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#aaa; font-weight:700; margin-bottom:10px; margin-top:18px; }
.det-chips-row { display:flex; gap:6px; flex-wrap:wrap; }
.det-chip { background:#fff; border:1.5px solid #e0e0e0; padding:5px 12px; font-size:11px; font-weight:600; letter-spacing:.5px; }
.det-colors-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.det-color-dot { width:28px; height:28px; border-radius:50%; border:1px solid rgba(0,0,0,.12); display:inline-block; flex-shrink:0; }
.det-comp-row { display:flex; justify-content:flex-start; gap:14px; align-items:center; padding:3px 0; font-size:13px; }
.det-cta-group { margin-top:18px; padding-top:16px; border-top:1px solid #ebebeb; }
.det-btn-pair { display:flex; gap:0; overflow:hidden; }
.det-btn-contact { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:#0a0a0a; color:#fff; border:none; cursor:pointer; padding:11px 8px; font-family:inherit; font-weight:700; font-size:10px; letter-spacing:1px; text-transform:uppercase; text-decoration:none; }
.det-btn-contact:hover { background:#333; }
.det-btn-wa { flex:0 0 44px; display:flex; align-items:center; justify-content:center; background:#fff; color:#25D366; text-decoration:none; border-left:1px solid rgba(0,0,0,.08); }
.det-btn-wa:hover { background:#f0faf5; }

/* Price block */
.popup-prices { margin:12px 0 4px; padding:12px 14px; background:#fafafa; border:1px solid #f0f0f0; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pp-label { font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#bbb; margin-right:2px; }
.pp-tregu-val { font-size:18px; font-weight:600; color:#bbb; text-decoration:line-through; letter-spacing:-.3px; }
.pp-arrow { font-size:14px; color:#ccc; }
.pp-oferte-val { font-size:18px; font-weight:800; color:#C8003E; letter-spacing:-.3px; }

/* Nav between articles */
.art-nav-btn { position:fixed; top:50%; background:rgba(255,255,255,.92); border:none; color:#111; width:36px; height:36px; border-radius:50%; font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:9100; padding:0; box-shadow:0 2px 8px rgba(0,0,0,.18); }
.art-nav-btn:disabled { opacity:.25; cursor:default; }
.art-nav-btn.prev { left:max(8px, calc(50% - min(550px,47vw) - 50px)); }
.art-nav-btn.next { right:max(8px, calc(50% - min(550px,47vw) - 50px)); }

/* Mobile */
@media(max-width:700px){
  #art-detail-overlay { padding:0!important; align-items:flex-end!important; }
  #art-detail-box { width:100vw!important; max-height:97vh!important; border-radius:16px 16px 0 0!important; box-shadow:none!important; }
  .det-thumbs-col { display:none!important; }
  .det-product-grid { flex-direction:column!important; padding:12px 14px 24px!important; gap:0!important; }
  .det-gallery { order:1; width:100%; }
  .det-main-img-wrap { aspect-ratio:4/3!important; }
  .det-info { order:2; margin-top:16px; width:100%; }
  .art-nav-btn { top:14px!important; background:rgba(0,0,0,.35)!important; color:#fff!important; box-shadow:none!important; }
  .art-nav-btn.prev { left:10px; }
  .art-nav-btn.next { right:10px; }
}

/* Footer */
.simple-footer { background:#111; color:#fff; padding:32px var(--side) 24px; }
.contact-locations { display:flex; gap:32px; flex-wrap:wrap; margin-bottom:20px; }
.contact-loc-name { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#555; margin-bottom:4px; }
.contact-loc-addr { font-size:12px; color:#888; line-height:1.5; }
.contact-footer { border-top:.5px solid #222; padding-top:16px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#444; }
.contact-brand { font-weight:700; letter-spacing:.5px; color:#555; }
</style>

<script>
var _arts = [];
var _prices = {};
var _currency = 'ALL';
var _katSettings = [];
var _activeSub = 'te-gjitha';
var _activeKat = 'te-gjitha';
var _lang = 'al';
var _artSlugMap = {};

function _slugify(str){
  return (str||'').toLowerCase()
    .replace(/ë/g,'e').replace(/ç/g,'c').replace(/â/g,'a').replace(/î/g,'i').replace(/û/g,'u')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);
}
function _artSlug(art){
  if(!art) return '';
  if(_artSlugMap && art.id && _artSlugMap[String(art.id)]) return _artSlugMap[String(art.id)];
  return _slugify((art.name||'')+(art.code?'-'+art.code:''));
}

var _TR = {
  al: {
    'te-gjitha':'Të Gjitha','meshkuj':'Meshkuj','femra':'Femra','fëmijë':'Fëmijë','femijë':'Fëmijë','femije':'Fëmijë',
    'mbathje':'Mbathje','kanatjere':'Kanatjere','kanatjere':'Kanatjere','bluze':'Bluze','çorape':'Çorape',
    'artikujt':'Artikujt','kerko':'Kërko...'
  },
  en: {
    'te-gjitha':'All','meshkuj':'Men','femra':'Women','fëmijë':'Kids','femijë':'Kids','femije':'Kids',
    'mbathje':'Underwear','kanatjere':'Tank Top','bluze':'T-Shirt','çorape':'Socks',
    'artikujt':'Products','kerko':'Search...'
  }
};

function tr(val){
  if(!val) return val;
  var key = val.toLowerCase();
  return (_TR[_lang] && _TR[_lang][key]) || val;
}

function setLang(lang){
  _lang = lang;
  var inp = document.getElementById('search-input');
  if(inp) inp.placeholder = tr('kerko');
  var bc = document.querySelector('.pg-breadcrumb');
  if(bc) bc.textContent = tr('artikujt');
  // PDF button label
  var pdfLbl = document.getElementById('pdf-btn-label');
  if(pdfLbl) pdfLbl.textContent = lang==='en' ? 'Create PDF' : 'Krijo PDF';
  // Load more button
  var lmBtn = document.querySelector('#load-more-wrap button');
  if(lmBtn) lmBtn.textContent = lang==='en' ? 'More...' : 'Ngarko më shumë';
  buildFilterBar();
}
var _openList = [];
var _openIdx = 0;
var _PG_SIZE = 16;
var _pgShown = 0;
var _pgList = [];
var _hasSelection = false;

function getPhotoSrc(p){ if(!p) return ''; if(typeof p==='string') return p; return p.src||p.url||''; }

// ── Load data ──────────────────────────────────────────
async function init(){
  // Always force-refresh so client always sees the latest articles
  try{ localStorage.removeItem('intal_cache_ts'); }catch(e){}
  // Load slug map for article page links
  fetch('/artikull/slugs.json').then(function(r){return r.json();}).then(function(m){_artSlugMap=m||{};}).catch(function(){});
  await sbSyncCache();
  var cache = {};
  try{ cache = JSON.parse(localStorage.getItem('intal_cache_v1')||'{}'); }catch(e){}
  _arts = cache.artikujt || [];
  _katSettings = cache.kategoriSettings || [];

  if(!_arts.length){
    var raw = await sbGet('artikujt');
    if(raw) try{ _arts = JSON.parse(raw); }catch(e){}
  }

  // Detect client slug from URL ?c=SLUG
  var _clientSlug = (new URLSearchParams(location.search)).get('c') || '';
  var _priceKey = _clientSlug ? 'katalog_cmime_'+_clientSlug : 'katalog_cmime';

  // Load prices, currency, language, and selected articles for this client
  var pr = await sbGet(_priceKey);
  if(pr){
    try{
      var obj = JSON.parse(pr);
      if(obj._currency){
        _currency = obj._currency;
        _prices = obj.prices || {};
        // Language set by admin
        if(obj._lang) _lang = obj._lang;
        // Filter to only selected articles (if key is present, even if empty)
        if(Object.prototype.hasOwnProperty.call(obj, '_selectedIds')){
          var selSet = {};
          (obj._selectedIds||[]).forEach(function(id){ selSet[id]=true; });
          _arts = _arts.filter(function(a){ return !!selSet[a.id]; });
          _hasSelection = true;
        }
      } else {
        _prices = obj;
      }
    }catch(e){}
  }

  setLang(_lang);
  if(_hasSelection){
    // Catalog with specific selection: show all chosen articles directly, no filter bar
    document.getElementById('dyn-filter-bar').style.display = 'none';
    renderGridAll(_arts, 'te-gjitha', 'te-gjitha');
  } else {
    buildFilterBar();
    renderGridAll(_arts, _activeSub, _activeKat);
  }
}

// ── Filter helpers — supports both sub/kat and gjinia/kategoria fields ──
function getArtSubs(a){
  var s = (a.sub&&(Array.isArray(a.sub)?a.sub.length:a.sub)) ? a.sub : a.gjinia;
  if(!s) return [];
  if(Array.isArray(s)) return s.filter(Boolean);
  return [s];
}
function getArtKats(a){
  var k = (a.kat&&(Array.isArray(a.kat)?a.kat.length:a.kat)) ? a.kat : a.kategoria;
  if(!k) return [];
  if(Array.isArray(k)) return k.filter(Boolean);
  return [k];
}
function artMatchesCat(a, cat){
  return getArtSubs(a).some(function(x){ return (x||'').toLowerCase()===cat.toLowerCase(); });
}
function artKatArr(a){ return getArtKats(a); }
function artMatchesKat(a, kat){ return getArtKats(a).some(function(x){ return (x||'').toLowerCase()===kat.toLowerCase(); }); }
function artMatchesQuery(a, q){
  var lq = q.toLowerCase();
  if((a.name||'').toLowerCase().indexOf(lq)>-1) return true;
  if((a.code||'').toLowerCase().indexOf(lq)>-1) return true;
  if(getArtKats(a).some(function(k){ return k.toLowerCase().indexOf(lq)>-1; })) return true;
  if(getArtSubs(a).some(function(s){ return s.toLowerCase().indexOf(lq)>-1; })) return true;
  return false;
}

// ── Search ─────────────────────────────────────────────
function doSearch(q){
  var clr = document.getElementById('search-clear');
  if(clr) clr.style.display = q ? 'inline' : 'none';
  var bar = document.getElementById('dyn-filter-bar');
  if(q){
    if(bar) bar.style.display = 'none';
    var found = _arts.filter(function(a){ return artMatchesQuery(a, q); });
    document.getElementById('pg-count').textContent = found.length+' ARTIKUJ';
    _pgList = found; _pgShown = 0;
    _pgRender(false);
  } else {
    if(bar) bar.style.display = 'flex';
    renderGridAll(_arts, _activeSub, _activeKat);
  }
}

// ── Filter bar (identical structure to artikujt.html) ─
function buildFilterBar(){
  var bar = document.getElementById('dyn-filter-bar');
  // Collect unique sub (gjinia) values
  var subs = [];
  _arts.forEach(function(a){
    getArtSubs(a).forEach(function(v){ v=(v||'').trim(); if(v && subs.indexOf(v)===-1) subs.push(v); });
  });
  // Row 1: "Të Gjitha/All" + gjinia buttons
  var row1 = '<div class="dfc-row">';
  row1 += '<button class="dfc'+((!_activeSub||_activeSub==='te-gjitha')?' active':'')+'" onclick="setSub(\'te-gjitha\')">'+tr('te-gjitha')+'</button>';
  subs.forEach(function(s){
    row1 += '<button class="dfc'+(s===_activeSub?' active':'')+'" data-sub="'+escHtml(s)+'" onclick="setSub(\''+s.replace(/'/g,"\\'")+'\')">'+tr(s)+'</button>';
  });
  row1 += '</div>';
  // Row 2: kat buttons — only visible when a gjinia is selected
  var row2 = '';
  if(_activeSub && _activeSub!=='te-gjitha'){
    var subArts = _arts.filter(function(a){ return artMatchesCat(a, _activeSub); });
    var kats = [];
    subArts.forEach(function(a){ getArtKats(a).forEach(function(k){ k=(k||'').trim(); if(k && kats.indexOf(k)===-1) kats.push(k); }); });
    if(kats.length){
      row2 = '<div class="dfc-row dfc-row-sub">';
      kats.forEach(function(k){
        row2 += '<button class="dfc-sub'+(k===_activeKat?' active':'')+'" data-kat="'+escHtml(k)+'" onclick="setKat(\''+k.replace(/'/g,"\\'")+'\')">'+tr(k)+'</button>';
      });
      row2 += '</div>';
    }
  }
  bar.innerHTML = row1 + row2;
  bar.style.display = 'flex';
}

function setSub(val){
  _activeSub = (val==='te-gjitha') ? 'te-gjitha' : ((_activeSub===val) ? 'te-gjitha' : val);
  _activeKat = 'te-gjitha';
  buildFilterBar();
  renderGridAll(_arts, _activeSub, _activeKat);
}
function setKat(val){
  _activeKat = (_activeKat===val) ? 'te-gjitha' : val;
  buildFilterBar();
  renderGridAll(_arts, _activeSub, _activeKat);
}

// ── Grid rendering ────────────────────────────────────
function renderGridAll(list, sub, kat){
  var show = list;
  if(sub && sub!=='te-gjitha') show = show.filter(function(a){ return artMatchesCat(a, sub); });
  if(kat && kat!=='te-gjitha') show = show.filter(function(a){ return artMatchesKat(a, kat); });
  document.getElementById('pg-count').textContent = show.length+' ARTIKUJ';
  _pgList = show; _pgShown = 0;
  _pgRender(false);
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function _pgRender(append){
  var grid = document.getElementById('dyn-grid');
  var wrap = document.getElementById('load-more-wrap');
  var slice = _pgList.slice(append ? _pgShown : 0, _pgShown + _PG_SIZE);
  if(!append){
    if(!_pgList.length){ grid.innerHTML='<div style="grid-column:1/-1;padding:80px 0;text-align:center;color:var(--muted);font-size:13px;">Nuk ka artikuj.</div>'; wrap.style.display='none'; _pgShown=0; return; }
    grid.innerHTML = slice.map(buildCard).join('');
    _pgShown = slice.length;
  } else {
    grid.innerHTML += slice.map(buildCard).join('');
    _pgShown += slice.length;
  }
  wrap.style.display = _pgShown < _pgList.length ? 'block' : 'none';
}
window.loadMoreArts = function(){ _pgRender(true); };

function buildCard(a){
  var photos = (a.photos||[]).map(getPhotoSrc).filter(Boolean);
  var img0 = photos[0]||'';
  var hasM = photos.length>1;
  var pa = hasM?' data-photos=\''+JSON.stringify(photos).replace(/'/g,'&#39;')+'\'':'';
  var imgEl = img0
    ? '<img src="'+img0+'" data-idx="0" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy">'
    : '<div style="width:100%;height:100%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:40px;">&#128085;</div>';
  var hoverAttr = hasM?' onmouseenter="hoverEnter(this)" onmouseleave="hoverLeave(this)"':'';
  var arr = hasM?'<button class="art-card-arr l" onclick="cardStep(event,this,-1)">&#8592;</button><button class="art-card-arr r" onclick="cardStep(event,this,1)">&#8594;</button>':'';

  var pr = _prices[a.id]||{};
  var cur = _currency || 'ALL';
  var priceHtml = '';
  if(pr.tregu || pr.oferte){
    priceHtml = '<div class="card-prices">'
      +(pr.tregu?'<span class="card-price-tregu">'+pr.tregu+' '+cur+'</span>':'')
      +(pr.tregu && pr.oferte?'<span style="color:#ccc;font-size:12px;">→</span>':'')
      +(pr.oferte?'<span class="card-price-oferte">'+pr.oferte+' '+cur+'</span>':'')
      +'</div>';
  }

  var cardOpen = '<div class="art-card" onclick="openDet(\''+a.id+'\')">';
  var cardClose = '</div>';
  return cardOpen
    +'<div class="art-card-img-wrap"'+pa+hoverAttr+'>'+imgEl+arr+'</div>'
    +'<div style="padding:6px 10px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">'
    +'<p class="art-card-name" style="font-size:13px;font-weight:500;letter-spacing:-.2px;color:var(--black);margin:0;word-break:break-word;">'+a.name+'</p>'
    +(a.code?'<p class="art-card-code" style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0;white-space:nowrap;flex-shrink:0;padding-top:1px;">Art: '+a.code+'</p>':'')
    +'</div>'
    +priceHtml
    +cardClose;
}

// ── Card hover/swipe ─────────────────────────────────
var _hoverTimers = {};
window.hoverEnter = function(wrap){
  var photos = JSON.parse(wrap.dataset.photos||'[]');
  if(photos.length<2) return;
  var idx = 0;
  _hoverTimers[wrap] = setInterval(function(){
    idx = (idx+1)%photos.length;
    var img = wrap.querySelector('img');
    if(img){ img.src=photos[idx]; img.dataset.idx=idx; }
  }, 900);
};
window.hoverLeave = function(wrap){
  clearInterval(_hoverTimers[wrap]);
  var photos = JSON.parse(wrap.dataset.photos||'[]');
  if(photos[0]){ var img=wrap.querySelector('img'); if(img){ img.src=photos[0]; img.dataset.idx=0; } }
};

window.cardStep = function(e, btn, dir){
  e.stopPropagation();
  var wrap = btn.parentElement;
  var idx = parseInt(wrap.querySelector('img').dataset.idx||0);
  var photos = JSON.parse(wrap.dataset.photos||'[]');
  var ni = (idx+dir+photos.length)%photos.length;
  wrap.querySelector('img').src = photos[ni];
  wrap.querySelector('img').dataset.idx = ni;
};

// ── PDF Generation ───────────────────────────────────────────
function _pdfLoadImg(src){
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas');
        c.width=img.naturalWidth||400; c.height=img.naturalHeight||400;
        c.getContext('2d').drawImage(img,0,0);
        resolve(c.toDataURL('image/jpeg',0.85));
      }catch(e){
        var img2=new Image(); img2.crossOrigin='anonymous';
        img2.onload=function(){
          try{
            var c2=document.createElement('canvas');
            c2.width=img2.naturalWidth||400; c2.height=img2.naturalHeight||400;
            c2.getContext('2d').drawImage(img2,0,0);
            resolve(c2.toDataURL('image/jpeg',0.85));
          }catch(e2){ resolve(null); }
        };
        img2.onerror=function(){ resolve(null); };
        img2.src=src;
      }
    };
    img.onerror=function(){ resolve(null); };
    img.src=src;
  });
}
function _pdfFormatComp(perberja,lang){
  if(!perberja||!perberja.length) return '';
  var M={'Pambuk':'Cotton','Viskon':'Viscose','Elastan':'Elastane','Poliester':'Polyester',
         'Najon':'Nylon','Liri':'Linen','Lesh':'Wool','Modal':'Modal','Bambu':'Bamboo'};
  return perberja.map(function(p){
    var m=lang==='en'?(M[p.material]||p.material):p.material;
    return (p.pct?p.pct+'% ':'')+m;
  }).join(', ');
}
window.generatePDF = async function(){
  if(!window.jspdf){ alert('jsPDF nuk u ngarkua. Provoni sërisht.'); return; }
  var btn=document.getElementById('pdf-btn');
  var lbl=document.getElementById('pdf-btn-label');
  btn.disabled=true; lbl.textContent=_lang==='en'?'Generating...':'Duke gjeneruar...';
  try{
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});

    var PW=210, PH=297, ML=16, MR=16;
    var xImg=ML, imgW=26, imgH=25;
    var xComp=ML+31, xColor=ML+103, xSize=ML+135;
    var xTregu=PW-MR-22, xOferte=PW-MR;
    var ROWS_PER_PAGE=8, HDR_H=52;
    var ROW_H=(PH-14-HDR_H)/ROWS_PER_PAGE;
    var pageNum=0;
    var BG=[246,243,238],BLACK=[18,18,18],GRAY=[148,143,136],LGRAY=[215,212,206],WARM=[148,120,83];

    function drawPage(){
      pageNum++;
      doc.setFillColor(BG[0],BG[1],BG[2]); doc.rect(0,0,PW,PH,'F');
      // Logo
      doc.setFontSize(22); doc.setFont('helvetica','bold'); doc.setTextColor(BLACK[0],BLACK[1],BLACK[2]);
      doc.text('intal',ML+4,25);
      var lw=doc.getTextWidth('intal');
      doc.setDrawColor(BLACK[0],BLACK[1],BLACK[2]); doc.setLineWidth(0.6);
      doc.line(ML+4,26.5,ML+4+lw,26.5);
      // UNDERWEAR
      doc.setFontSize(5.5); doc.setFont('helvetica','normal'); doc.setTextColor(WARM[0],WARM[1],WARM[2]);
      doc.setCharSpace(2.8); doc.text('UNDERWEAR',ML+4,33); doc.setCharSpace(0);
      // PRODUCT CATALOG
      doc.setFontSize(6.5); doc.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
      doc.setCharSpace(0.8); doc.text('PRODUCT CATALOG',PW-MR,14,{align:'right'}); doc.setCharSpace(0);
      if(pageNum>1){ doc.setFontSize(7); doc.setTextColor(GRAY[0],GRAY[1],GRAY[2]); doc.text(''+pageNum,PW-MR,PH-5,{align:'right'}); }
      // Divider
      doc.setDrawColor(LGRAY[0],LGRAY[1],LGRAY[2]); doc.setLineWidth(0.35);
      doc.line(ML,40,PW-MR,40);
      // Column headers
      doc.setFontSize(5.5); doc.setFont('helvetica','normal'); doc.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
      doc.setCharSpace(1);
      doc.text('IMAGE',xImg,48); doc.text('COMPOSITION',xComp,48);
      doc.text('COLOR',xColor,48); doc.text('SIZE',xSize,48);
      var hTregu=_lang==='en'?'REGULAR PRICE':'CMIM TREGU';
      var hOferte=_lang==='en'?'OFFER PRICE':'CMIM OFERTE';
      doc.text(hTregu,xTregu,48,{align:'right'}); doc.text(hOferte,xOferte,48,{align:'right'});
      doc.setCharSpace(0);
      doc.setDrawColor(LGRAY[0],LGRAY[1],LGRAY[2]); doc.setLineWidth(0.2);
      doc.line(ML,HDR_H,PW-MR,HDR_H);
    }

    drawPage();
    var cur=_currency||'ALL', curSym=cur==='EUR'?'€':cur, lang=_lang||'al';
    var arts=_arts;

    for(var i=0;i<arts.length;i++){
      if(i>0&&i%ROWS_PER_PAGE===0){ doc.addPage(); drawPage(); }
      var ri=i%ROWS_PER_PAGE, rowY=HDR_H+ri*ROW_H, midY=rowY+ROW_H/2, a=arts[i];

      // Image (drawn before separator so separator overlaps on top)
      var iy=rowY+1.5;
      var photos=(a.photos||[]).map(getPhotoSrc).filter(Boolean);
      var imgData=photos[0]?await _pdfLoadImg(photos[0]):null;
      if(imgData){ doc.addImage(imgData,'JPEG',xImg,iy,imgW,imgH,'','FAST'); }
      else { doc.setFillColor(LGRAY[0],LGRAY[1],LGRAY[2]); doc.rect(xImg,iy,imgW,imgH,'F'); }

      // Name + composition
      var nameLines=doc.splitTextToSize(a.name||'',65);
      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(BLACK[0],BLACK[1],BLACK[2]);
      var compY;
      if(nameLines.length>1){
        doc.text(nameLines[0],xComp,midY-6); doc.text(nameLines[1],xComp,midY-0.5); compY=midY+6;
      } else { doc.text(nameLines[0],xComp,midY-2); compY=midY+5; }
      var comp=_pdfFormatComp(a.perberja,lang);
      if(comp){
        doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(WARM[0],WARM[1],WARM[2]);
        doc.splitTextToSize(comp,65).slice(0,2).forEach(function(cl,ci){ doc.text(cl,xComp,compY+ci*4.5); });
      }

      // Color circles
      (a.ngjyrat||[]).slice(0,4).forEach(function(n,ni){
        var cx=xColor+ni*8+4,cy=midY,hex=n.hex||n.color||'#ccc',r=200,g=200,b=200;
        if(hex&&hex.length>=7){r=parseInt(hex.slice(1,3),16);g=parseInt(hex.slice(3,5),16);b=parseInt(hex.slice(5,7),16);}
        doc.setFillColor(r,g,b); doc.setDrawColor(188,185,179); doc.setLineWidth(0.3); doc.circle(cx,cy,3.5,'FD');
      });

      // Sizes
      var sizes=a.sizes||a.masat||[];
      if(sizes.length){
        var s1=sizes.slice(0,3),s2=sizes.slice(3);
        doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(BLACK[0],BLACK[1],BLACK[2]);
        doc.text(s1.join('  '),xSize,midY-(s2.length?2.5:0));
        if(s2.length){ doc.setFontSize(6.5); doc.setFont('helvetica','normal'); doc.setTextColor(GRAY[0],GRAY[1],GRAY[2]); doc.text('('+s2.join('  ')+')',xSize,midY+3.5); }
      }

      // Price: tregu (small gray left) | oferte (bold black right)
      var pr=_prices[a.id]||{};
      if(pr.tregu){
        doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
        doc.text(curSym+' '+pr.tregu,xTregu,midY,{align:'right'});
      }
      if(pr.oferte){
        doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(BLACK[0],BLACK[1],BLACK[2]);
        doc.text(curSym+' '+pr.oferte,xOferte,midY,{align:'right'});
      } else if(pr.tregu&&!pr.oferte){
        doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(BLACK[0],BLACK[1],BLACK[2]);
        doc.text(curSym+' '+pr.tregu,xOferte,midY,{align:'right'});
      }

      // Row separator (drawn AFTER image — appears on top)
      doc.setDrawColor(LGRAY[0],LGRAY[1],LGRAY[2]); doc.setLineWidth(0.2);
      doc.line(ML,rowY+ROW_H,PW-MR,rowY+ROW_H);
    }
    doc.save('Intal-Katalog.pdf');
  }catch(err){
    console.error(err); alert('Gabim gjatë gjenerimit të PDF. Provoni sërisht.');
  }finally{
    btn.disabled=false; lbl.textContent=_lang==='en'?'Create PDF':'Krijo PDF';
  }
};

init();
(function(){var y=new Date().getFullYear();var el=document.getElementById('cp-yr-kat');if(el)el.textContent=y;})();
</script>
