<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog Generator — Intal</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--accent:#C8003E;--black:#111;--white:#fff;--bg:#f4f4f4;--border:#e2e2e2;--muted:#888;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);min-height:100vh;}

/* TOP BAR */
.top-bar{background:var(--black);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;}
.logo{background:var(--accent);padding:3px 10px;border-radius:4px;font-weight:900;font-size:13px;color:#fff;letter-spacing:-.5px;}
.top-title{font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase;}
.btn-pdf{background:var(--accent);color:#fff;border:none;padding:8px 20px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.8px;cursor:pointer;text-transform:uppercase;}
.btn-pdf:hover{opacity:.85;}

/* FILTERS */
.filter-wrap{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.filter-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-right:4px;}
.f-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:#fafafa;font-size:11px;font-weight:600;cursor:pointer;color:var(--black);transition:all .15s;}
.f-btn.active{background:var(--black);color:#fff;border-color:var(--black);}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px;}

/* PRICE HEADER */
.price-header{padding:12px 24px;display:flex;align-items:center;justify-content:space-between;background:#fff7f7;border-bottom:1px solid #fde;flex-wrap:wrap;gap:8px;}
.price-hint{font-size:11px;color:var(--accent);font-weight:600;}
.btn-clear{font-size:11px;color:var(--muted);background:none;border:1px solid var(--border);padding:4px 12px;border-radius:4px;cursor:pointer;}
.btn-clear:hover{color:var(--black);}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;padding:24px;}

.card{background:#fff;border-radius:8px;border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;}
.card-img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#f0f0f0;display:block;}
.card-img-placeholder{width:100%;aspect-ratio:3/4;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:32px;color:#ccc;}
.card-body{padding:12px;flex:1;display:flex;flex-direction:column;gap:6px;}
.card-kat{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
.card-name{font-size:13px;font-weight:700;color:var(--black);line-height:1.3;}
.card-code{font-size:10px;color:var(--muted);}
.card-sizes{font-size:10px;color:#555;margin-top:2px;}
.price-row{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:6px;}
.price-input{flex:1;border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:13px;font-weight:700;color:var(--accent);background:#fff8f8;outline:none;text-align:right;}
.price-input:focus{border-color:var(--accent);}
.price-currency{font-size:11px;font-weight:700;color:var(--muted);}

/* EMPTY */
.empty{text-align:center;padding:60px 24px;color:var(--muted);font-size:14px;}

/* COUNT */
.count-bar{padding:10px 24px;font-size:11px;color:var(--muted);letter-spacing:.5px;}

/* ===== PRINT STYLES ===== */
@media print {
  .top-bar, .filter-wrap, .price-header, .count-bar { display:none !important; }
  body { background:#fff; }

  .print-header { display:block !important; }
  .grid { grid-template-columns:repeat(3,1fr); gap:14px; padding:0; page-break-inside:avoid; }
  .card { border:1px solid #ddd; break-inside:avoid; page-break-inside:avoid; }
  .card-img { aspect-ratio:3/4; }
  .price-input { border:none; background:none; padding:0; font-size:14px; }
  .price-row { border-top:1px solid #eee; padding-top:8px; }
}

/* PRINT HEADER (hidden on screen) */
.print-header {
  display:none;
  text-align:center;
  padding:20px 0 14px;
  border-bottom:2px solid var(--black);
  margin-bottom:20px;
}
.print-header .ph-logo { font-size:28px; font-weight:900; letter-spacing:-1px; }
.print-header .ph-logo span { color:var(--accent); }
.print-header .ph-sub { font-size:11px; color:var(--muted); letter-spacing:2px; margin-top:4px; }
.print-header .ph-date { font-size:10px; color:#aaa; margin-top:6px; }
</style>
</head>
<body>

<div class="top-bar">
  <div style="display:flex;align-items:center;gap:12px;">
    <span class="logo">intal</span>
    <span class="top-title">Katalog Generator</span>
  </div>
  <button class="btn-pdf" onclick="generatePDF()">&#128196; Gjenero PDF</button>
</div>

<!-- PRINT HEADER -->
<div class="print-header">
  <div class="ph-logo">INTAL <span>UNDERWEAR</span></div>
  <div class="ph-sub">KATALOG ÇMIMESH</div>
  <div class="ph-date" id="print-date"></div>
</div>

<!-- FILTERS -->
<div class="filter-wrap">
  <span class="filter-label">Gjinia</span>
  <button class="f-btn active" onclick="setFilter('gjinia','te-gjitha',this)">Të Gjitha</button>
  <button class="f-btn" onclick="setFilter('gjinia','meshkuj',this)">Meshkuj</button>
  <button class="f-btn" onclick="setFilter('gjinia','femra',this)">Femra</button>
  <button class="f-btn" onclick="setFilter('gjinia','femijë',this)">Fëmijë</button>
  <div class="sep"></div>
  <span class="filter-label">Kategoria</span>
  <button class="f-btn active" onclick="setFilter('kat','te-gjitha',this)" data-group="kat">Të Gjitha</button>
  <div id="kat-btns" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
</div>

<div class="price-header">
  <span class="price-hint">&#9998; Shkruani çmimin preferencial për secilin artikull (ALL)</span>
  <button class="btn-clear" onclick="clearPrices()">Pastro çmimet</button>
</div>

<div class="count-bar" id="count-bar">Duke ngarkuar...</div>
<div class="grid" id="grid"></div>

<script>
var _allArts = [];
var _filters = { gjinia:'te-gjitha', kat:'te-gjitha' };
var _prices = {};

// Set print date
document.getElementById('print-date').textContent = new Date().toLocaleDateString('sq-AL',{day:'2-digit',month:'long',year:'numeric'});

async function init(){
  await sbSyncCache();
  try {
    var cache = JSON.parse(localStorage.getItem('intal_cache_v1')||'{}');
    _allArts = cache.artikujt || [];
  } catch(e){ _allArts = []; }

  if(!_allArts.length){
    var raw = await sbGet('artikujt');
    if(raw){ try{ _allArts = JSON.parse(raw); }catch(e){} }
  }

  buildKatBtns();
  renderGrid();
}

function buildKatBtns(){
  var cats = {};
  _allArts.forEach(function(a){
    var k = (a.kategoria||'').trim();
    if(k) cats[k] = true;
  });
  var wrap = document.getElementById('kat-btns');
  wrap.innerHTML = Object.keys(cats).sort().map(function(k){
    return '<button class="f-btn" onclick="setFilter(\'kat\',\''+k+'\',this)" data-group="kat">'+k+'</button>';
  }).join('');
}

function setFilter(type, val, btn){
  _filters[type] = val;
  // update active state for group
  var group = btn.dataset.group || type;
  var container = btn.parentElement;
  // for gjinia group, siblings in filter-wrap
  container.querySelectorAll('.f-btn').forEach(function(b){
    if(b.dataset.group === group || (!b.dataset.group && type==='gjinia')){
      b.classList.remove('active');
    }
  });
  // simpler: just toggle within same onclick group
  if(type==='gjinia'){
    document.querySelectorAll('.filter-wrap .f-btn:not([data-group])').forEach(function(b){ b.classList.remove('active'); });
  } else {
    document.querySelectorAll('.filter-wrap .f-btn[data-group="kat"]').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.filter-wrap .f-btn:not([data-group])').forEach(function(b){ if(b.textContent.trim()==='Të Gjitha'&&type==='kat') return; });
  }
  btn.classList.add('active');
  renderGrid();
}

function getFiltered(){
  return _allArts.filter(function(a){
    var gOk = _filters.gjinia==='te-gjitha' || (a.gjinia||'').toLowerCase()===_filters.gjinia.toLowerCase();
    var kOk = _filters.kat==='te-gjitha' || (a.kategoria||'').toLowerCase()===_filters.kat.toLowerCase();
    return gOk && kOk;
  });
}

function renderGrid(){
  var list = getFiltered();
  var grid = document.getElementById('grid');
  document.getElementById('count-bar').textContent = list.length + ' artikuj';

  if(!list.length){
    grid.innerHTML = '<div class="empty">Nuk ka artikuj për filtrin e zgjedhur.</div>';
    return;
  }

  grid.innerHTML = list.map(function(a){
    var photo = (a.photos && a.photos[0]) ? a.photos[0] : '';
    var sizes = (a.sizes||[]).join(', ');
    var priceVal = _prices[a.id] || '';
    return '<div class="card" data-id="'+a.id+'">'
      + (photo
          ? '<img class="card-img" src="'+photo+'" alt="'+a.name+'" loading="lazy">'
          : '<div class="card-img-placeholder">&#128085;</div>')
      + '<div class="card-body">'
      + '<span class="card-kat">'+(a.kategoria||'')+(a.gjinia?' · '+a.gjinia:'')+'</span>'
      + '<div class="card-name">'+a.name+'</div>'
      + '<div class="card-code">KOD: '+(a.code||'—')+'</div>'
      + (sizes ? '<div class="card-sizes">Masa: '+sizes+'</div>' : '')
      + '<div class="price-row">'
      + '<input class="price-input" type="number" placeholder="Çmimi" value="'+priceVal+'" min="0" step="1" onchange="savePrice(\''+a.id+'\',this.value)">'
      + '<span class="price-currency">ALL</span>'
      + '</div>'
      + '</div></div>';
  }).join('');
}

function savePrice(id, val){
  if(val) _prices[id] = val;
  else delete _prices[id];
}

function clearPrices(){
  _prices = {};
  renderGrid();
}

function generatePDF(){
  // Sync prices from inputs before print
  document.querySelectorAll('.card[data-id]').forEach(function(card){
    var id = card.dataset.id;
    var inp = card.querySelector('.price-input');
    if(inp && inp.value) _prices[id] = inp.value;
    else if(inp) delete _prices[id];
  });
  window.print();
}

init();
</script>
</body>
</html>
