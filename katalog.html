<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog Generator — Intal</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--accent:#C8003E;--black:#111;--bg:#f0f0f0;--border:#e0e0e0;--muted:#888;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);min-height:100vh;}

/* TOP BAR */
.top-bar{background:var(--black);height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.logo{background:var(--accent);padding:3px 10px;border-radius:4px;font-weight:900;font-size:13px;color:#fff;letter-spacing:-.5px;}
.top-center{font-size:11px;color:#777;letter-spacing:1px;text-transform:uppercase;}
.sel-badge{background:#fff;color:var(--black);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;margin-left:8px;}
.btn-pdf{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;white-space:nowrap;}
.btn-pdf:disabled{opacity:.4;cursor:not-allowed;}

/* FILTERS */
.filters{background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.flabel{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-right:2px;}
.fb{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:#fafafa;font-size:11px;font-weight:600;cursor:pointer;color:var(--black);transition:all .15s;}
.fb.on{background:var(--black);color:#fff;border-color:var(--black);}
.vsep{width:1px;height:18px;background:var(--border);margin:0 2px;}
.sel-actions{margin-left:auto;display:flex;gap:8px;}
.btn-sel-all,.btn-sel-none{font-size:11px;color:var(--muted);background:none;border:1px solid var(--border);padding:4px 12px;border-radius:4px;cursor:pointer;}
.btn-sel-all:hover,.btn-sel-none:hover{color:var(--black);border-color:#aaa;}

/* COUNT */
.info-bar{padding:10px 20px;font-size:11px;color:var(--muted);display:flex;gap:16px;}
.info-bar b{color:var(--black);}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:16px 20px;}

.card{background:#fff;border-radius:8px;border:2px solid transparent;overflow:hidden;cursor:pointer;transition:border-color .15s, box-shadow .15s;position:relative;display:flex;flex-direction:column;}
.card:hover{border-color:#ccc;}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}

/* Checkbox overlay */
.card-check{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;z-index:2;transition:all .15s;}
.card.selected .card-check{background:var(--accent);border-color:var(--accent);}
.card-check svg{display:none;width:12px;height:12px;}
.card.selected .card-check svg{display:block;}

.card-img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#f0f0f0;display:block;}
.card-img-ph{width:100%;aspect-ratio:3/4;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:28px;color:#ccc;}

.card-body{padding:10px 10px 12px;flex:1;display:flex;flex-direction:column;gap:4px;}
.card-kat{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
.card-name{font-size:12px;font-weight:700;color:var(--black);line-height:1.3;}
.card-code{font-size:10px;color:#aaa;}
.card-sizes{font-size:10px;color:#666;margin-top:2px;}
.price-row{margin-top:8px;display:flex;align-items:center;gap:5px;}
.price-input{flex:1;border:1px solid var(--border);border-radius:4px;padding:5px 7px;font-size:12px;font-weight:700;color:var(--accent);background:#fff8f8;outline:none;text-align:right;min-width:0;}
.price-input:focus{border-color:var(--accent);}
.price-cur{font-size:10px;color:var(--muted);font-weight:600;}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);}

/* ===== PRINT ===== */
@media print {
  .top-bar,.filters,.info-bar{display:none!important;}
  body{background:#fff;}
  .print-header{display:block!important;}
  .grid{grid-template-columns:repeat(3,1fr)!important;gap:12px!important;padding:0!important;}
  .card{border:1px solid #ddd!important;box-shadow:none!important;break-inside:avoid;page-break-inside:avoid;}
  .card-check{display:none!important;}
  .card.unselected{display:none!important;}
  .price-input{border:none!important;background:none!important;padding:0!important;color:#C8003E!important;}
}

/* PRINT HEADER */
.print-header{display:none;text-align:center;padding:18px 0 12px;border-bottom:2px solid #111;margin-bottom:18px;}
.ph-logo{font-size:26px;font-weight:900;letter-spacing:-1px;}
.ph-logo span{color:var(--accent);}
.ph-sub{font-size:10px;color:#888;letter-spacing:2px;margin-top:3px;}
.ph-date{font-size:10px;color:#bbb;margin-top:4px;}
</style>
</head>
<body>

<div class="top-bar">
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="logo">intal</span>
    <span class="top-center">Katalog<span class="sel-badge" id="sel-count">0 zgjedhur</span></span>
  </div>
  <button class="btn-pdf" id="btn-pdf" onclick="generatePDF()" disabled>&#128196; Gjenero PDF</button>
</div>

<div class="print-header">
  <div class="ph-logo">INTAL <span>UNDERWEAR</span></div>
  <div class="ph-sub">KATALOG ÇMIMESH</div>
  <div class="ph-date" id="print-date"></div>
</div>

<div class="filters">
  <span class="flabel">Gjinia</span>
  <button class="fb on" onclick="setF('g','te-gjitha',this)">Të Gjitha</button>
  <button class="fb" onclick="setF('g','meshkuj',this)">Meshkuj</button>
  <button class="fb" onclick="setF('g','femra',this)">Femra</button>
  <button class="fb" onclick="setF('g','femijë',this)">Fëmijë</button>
  <div class="vsep"></div>
  <span class="flabel">Kategoria</span>
  <button class="fb on" onclick="setF('k','te-gjitha',this)" data-kg>Të Gjitha</button>
  <span id="kat-wrap" style="display:flex;flex-wrap:wrap;gap:8px;"></span>
  <div class="sel-actions">
    <button class="btn-sel-all" onclick="selAll()">Zgjidh të gjitha</button>
    <button class="btn-sel-none" onclick="selNone()">Hiq të gjitha</button>
  </div>
</div>

<div class="info-bar">
  <span id="info-total"><b>0</b> artikuj</span>
  <span id="info-sel"><b>0</b> zgjedhur</span>
</div>

<div class="grid" id="grid"></div>

<script>
var _arts = [];
var _selected = {};  // id -> true
var _prices = {};    // id -> price string
var _fg = 'te-gjitha', _fk = 'te-gjitha';

document.getElementById('print-date').textContent =
  new Date().toLocaleDateString('sq-AL',{day:'2-digit',month:'long',year:'numeric'});

async function init(){
  await sbSyncCache();
  var cache = {};
  try{ cache = JSON.parse(localStorage.getItem('intal_cache_v1')||'{}'); }catch(e){}
  _arts = cache.artikujt || [];
  if(!_arts.length){
    var raw = await sbGet('artikujt');
    if(raw) try{ _arts = JSON.parse(raw); }catch(e){}
  }
  buildKats();
  render();
}

function buildKats(){
  var seen = {};
  _arts.forEach(function(a){ var k=(a.kategoria||'').trim(); if(k) seen[k]=true; });
  document.getElementById('kat-wrap').innerHTML = Object.keys(seen).sort().map(function(k){
    return '<button class="fb" onclick="setF(\'k\',\''+k+'\',this)" data-kg>'+k+'</button>';
  }).join('');
}

function setF(type, val, btn){
  if(type==='g') _fg=val; else _fk=val;
  var attr = 'data-kg';
  if(type==='g'){
    document.querySelectorAll('.filters .fb:not([data-kg])').forEach(function(b){ b.classList.remove('on'); });
  } else {
    document.querySelectorAll('.filters .fb[data-kg]').forEach(function(b){ b.classList.remove('on'); });
  }
  btn.classList.add('on');
  render();
}

function filtered(){
  return _arts.filter(function(a){
    var gOk = _fg==='te-gjitha' || (a.gjinia||'').toLowerCase()===_fg.toLowerCase();
    var kOk = _fk==='te-gjitha' || (a.kategoria||'').toLowerCase()===_fk.toLowerCase();
    return gOk && kOk;
  });
}

function render(){
  var list = filtered();
  var grid = document.getElementById('grid');
  if(!list.length){
    grid.innerHTML='<div class="empty">Nuk ka artikuj për këtë filtër.</div>';
    updateCounts();
    return;
  }
  grid.innerHTML = list.map(function(a){
    var ph = (a.photos&&a.photos[0]) ? a.photos[0] : '';
    var sz = (a.sizes||[]).join(', ');
    var sel = _selected[a.id] ? ' selected' : ' unselected';
    var price = _prices[a.id] || '';
    return '<div class="card'+sel+'" data-id="'+a.id+'" onclick="toggleCard(event,\''+a.id+'\')">'
      +'<div class="card-check"><svg viewBox="0 0 12 10" fill="none"><polyline points="1,5 4.5,9 11,1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
      +(ph?'<img class="card-img" src="'+ph+'" alt="" loading="lazy">':'<div class="card-img-ph">&#128085;</div>')
      +'<div class="card-body">'
      +'<span class="card-kat">'+(a.kategoria||'')+(a.gjinia?' · '+a.gjinia:'')+'</span>'
      +'<div class="card-name">'+a.name+'</div>'
      +'<div class="card-code">KOD: '+(a.code||'—')+'</div>'
      +(sz?'<div class="card-sizes">Masa: '+sz+'</div>':'')
      +'<div class="price-row">'
      +'<input class="price-input" type="number" placeholder="Çmimi" value="'+price+'" min="0" step="1"'
      +' onclick="event.stopPropagation()" onchange="savePrice(\''+a.id+'\',this.value)">'
      +'<span class="price-cur">ALL</span>'
      +'</div>'
      +'</div></div>';
  }).join('');
  updateCounts();
}

function toggleCard(e, id){
  if(e.target.classList.contains('price-input')) return;
  if(_selected[id]) delete _selected[id];
  else _selected[id] = true;
  var card = document.querySelector('.card[data-id="'+id+'"]');
  if(card){ card.classList.toggle('selected'); card.classList.toggle('unselected'); }
  updateCounts();
}

function savePrice(id, val){
  if(val) _prices[id]=val; else delete _prices[id];
}

function selAll(){
  filtered().forEach(function(a){ _selected[a.id]=true; });
  render();
}
function selNone(){
  filtered().forEach(function(a){ delete _selected[a.id]; });
  render();
}

function updateCounts(){
  var total = filtered().length;
  var selN = Object.keys(_selected).length;
  document.getElementById('info-total').innerHTML='<b>'+total+'</b> artikuj';
  document.getElementById('info-sel').innerHTML='<b>'+selN+'</b> zgjedhur';
  document.getElementById('sel-count').textContent = selN+' zgjedhur';
  document.getElementById('btn-pdf').disabled = selN===0;
}

function generatePDF(){
  // sync prices from inputs
  document.querySelectorAll('.card[data-id]').forEach(function(card){
    var id=card.dataset.id, inp=card.querySelector('.price-input');
    if(inp&&inp.value) _prices[id]=inp.value;
    else if(inp) delete _prices[id];
  });
  window.print();
}

init();
</script>
</body>
</html>
