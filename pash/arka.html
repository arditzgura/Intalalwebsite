  </div>
  <nav class="sidebar-nav">

  <div class="sidebar-backup">

<div class="main">

    <div class="topbar-user">

      <div class="topbar-name" id="topbar-name">Arka — Cash</div>
    </div>
  </div>
  <div class="content">
    <div class="list-head">
      <div>
        <div class="page-title" id="page-title">Arka — Cash</div>
        <div class="page-sub" id="page-sub">Mbyllje Muaji, Hyrje dhe Dalje në Cash</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <!-- Tab switcher -->
        <div class="arka-tab-bar">
          <button id="tab-cash"  class="arka-tab active-cash"  onclick="setTab('cash')"><i class="ri-hand-coin-line"></i> Cash</button>

            <button class="dp-clear" onclick="DP.clear()">Pastro</button>
            <button class="dp-today" onclick="DP.today()">Sot</button>

    </div>

    <div class="card" id="list-wrap"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     HYRJE MODAL
═══════════════════════════════════════════════════════════════ -->
<div class="modal-backdrop" id="modal-hyrje-bd" onclick="if(event.target===this)closeModal('hyrje')">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-hyrje-title" style="color:var(--green,#1a9e6e)"><i class="ri-arrow-down-circle-line"></i> Hyrje</h2>
      <button class="modal-close" onclick="closeModal('hyrje')">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Përshkrimi <span style="color:var(--accent);font-size:10px;">*</span></label>
        <div class="ac-wrap">
          <input type="text" id="fh-pershkrim" autocomplete="off"
            style="background:var(--surface);border:0.5px solid var(--border);border-radius:7px;
                   padding:9px 12px;font-family:'Switzer',sans-serif;font-size:13px;
                   color:var(--text);outline:none;width:100%;transition:border-color .15s"
            placeholder="p.sh. Arkëtim shitje, Pagesë klient..."
            oninput="acPershkrim('fh-pershkrim','ac-hyrje-dd',this.value)"
            onfocus="acPershkrim('fh-pershkrim','ac-hyrje-dd',this.value)">
          <div class="ac-dd" id="ac-hyrje-dd"></div>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Data</label>
          <input type="date" id="fh-data">
        </div>
        <div class="field">
          <label>Shuma (L) <span style="color:var(--accent);font-size:10px;">*</span></label>
          <input type="number" id="fh-shuma" min="0" step="0.01" placeholder="0.00"
            style="font-size:16px;font-weight:600;padding:9px 12px;color:var(--green,#1a9e6e)"
            oninput="this.style.color=parseFloat(this.value)>0?'var(--green,#1a9e6e)':'var(--text)'">
        </div>
      </div>
      <div class="field">
        <label>Shënime <span style="color:var(--muted);font-size:9px;text-transform:none;letter-spacing:0">(opsional)</span></label>
        <textarea id="fh-notes" placeholder="Detaje shtesë..." style="min-height:52px"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-secondary" onclick="closeModal('hyrje')">Anulo</button>
      <button class="btn-hyrje" onclick="saveArka('hyrje')"><i class="ri-save-line"></i> Ruaj Hyrjen</button>
    </div>
  </div>
</div>

<!-- Confirm delete -->
<div class="modal-backdrop confirm-modal" id="conf-bd" onclick="if(event.target===this)closeConf()">
  <div class="modal" style="max-width:360px">
    <div class="modal-head"><h2>Fshi Veprimin</h2><button class="modal-close" onclick="closeConf()">&#x2715;</button></div>
    <div class="confirm-body">Jeni të sigurt? Ky veprim nuk mund të kthehet.</div>

<div id="toast"></div>
<script src="pash-data.js"></script>
<script>
let editId    = null;
let editLloji = null;
let deleteId  = null;
let activeTab = 'cash';   // 'cash' | 'banka'
let typeFlt   = '';       // '' | 'mbyllje' | 'hyrje' | 'dalje'
let sortCol   = 'data';
let sortDir   = 'desc';

/* ── Tab ─────────────────────────────────────────────────────── */
function setTab(t){
  activeTab = t;
  typeFlt   = '';

  document.getElementById('tab-cash').className  = 'arka-tab' + (t==='cash'  ? ' active-cash'  : '');
  document.getElementById('tab-banka').className = 'arka-tab' + (t==='banka' ? ' active-banka' : '');

  const isCash = t === 'cash';
  document.getElementById('topbar-name').textContent = isCash ? 'Arka — Cash' : 'Arka — Bankë';
  document.getElementById('page-title').textContent  = isCash ? 'Arka — Cash' : 'Arka — Bankë';
  document.getElementById('page-sub').textContent    = isCash
    ? 'Mbyllje Muaji, Hyrje dhe Dalje në Cash'
    : 'Hyrje dhe Dalje bankare';

  // Nav active state
  document.getElementById('nav-cash').classList.toggle('active',  isCash);
  document.getElementById('nav-banka').classList.toggle('active', !isCash);

  // Update hash without scrolling
  history.replaceState(null,'', isCash ? 'arka.html' : 'arka.html#banka');

  updateActions();
  updateTypeFilters();
  renderList();
}

function updateActions(){
  const el = document.getElementById('arka-actions');
  if(activeTab === 'cash'){
    el.innerHTML = `
      <button class="btn-mbyllje" onclick="openModal('mbyllje')"><i class="ri-calendar-check-line"></i> Mbyllje Muaji</button>
      <button class="btn-hyrje"   onclick="openModal('hyrje')"><i class="ri-arrow-down-circle-line"></i> Hyrje Cash</button>
      <button class="btn-dalje"   onclick="openModal('dalje')"><i class="ri-arrow-up-circle-line"></i> Dalje Cash</button>`;
  } else {
    el.innerHTML = `
      <button class="btn-hyrje" onclick="openModal('hyrje')"><i class="ri-arrow-down-circle-line"></i> Hyrje Bankë</button>
      <button class="btn-dalje" onclick="openModal('dalje')"><i class="ri-arrow-up-circle-line"></i> Dalje Bankë</button>`;
  }
}

function updateTypeFilters(){
  const el = document.getElementById('type-filters');
  const pills = activeTab === 'cash'
    ? [
        {id:'tf-all',     t:'',         label:'Të gjitha', cls:''},
        {id:'tf-mbyllje', t:'mbyllje',  label:'<i class="ri-calendar-check-line"></i> Mbyllje', cls:'tf-mbyllje'},
        {id:'tf-hyrje',   t:'hyrje',    label:'<i class="ri-arrow-down-circle-line"></i> Hyrje', cls:'tf-hyrje'},
        {id:'tf-dalje',   t:'dalje',    label:'<i class="ri-arrow-up-circle-line"></i> Dalje',  cls:'tf-dalje'},
      ]
    : [
        {id:'tf-all',   t:'',       label:'Të gjitha', cls:''},
        {id:'tf-hyrje', t:'hyrje',  label:'<i class="ri-arrow-down-circle-line"></i> Hyrje', cls:'tf-hyrje'},
        {id:'tf-dalje', t:'dalje',  label:'<i class="ri-arrow-up-circle-line"></i> Dalje',  cls:'tf-dalje'},
      ];
  el.innerHTML = pills.map(p=>{
    const isActive = typeFlt === p.t;
    const cls = 'tf-btn' + (isActive ? (' tf-active' + (p.cls?' '+p.cls:'')) : '');
    return `<button id="${p.id}" class="${cls}" onclick="setTypeFlt('${p.t}')">${p.label}</button>`;
  }).join('');
}

function setTypeFlt(t){
  typeFlt = t;
  updateTypeFilters();
  renderList();
}

function setSort(col){
  if(sortCol===col) sortDir = sortDir==='asc'?'desc':'asc';
  else { sortCol=col; sortDir='asc'; }
  renderList();
}

/* ── Autocomplete ────────────────────────────────────────────── */
function acPershkrim(inputId, ddId, q){
  const dd = document.getElementById(ddId);
  const ql = q.toLowerCase().trim();
  const prev = [...new Set(DB.arka.map(x=>x.pershkrim).filter(Boolean))];
  const matches = ql ? prev.filter(p=>p.toLowerCase().includes(ql)) : prev.slice(0,8);
  if(!matches.length){ dd.classList.remove('open'); return; }
  let html = '<div class="ac-group">Nga historia</div>';
  html += matches.slice(0,8).map(p=>{
    const hi = ql ? p.replace(new RegExp('('+ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>') : esc(p);
    return `<div class="ac-opt" data-val="${esc(p)}">${hi}</div>`;
  }).join('');
  dd.innerHTML = html; dd.classList.add('open');
  dd.querySelectorAll('.ac-opt').forEach(el=>{
    el.addEventListener('mousedown', e=>{
      e.preventDefault();
      document.getElementById(inputId).value = el.dataset.val;
      dd.classList.remove('open');
    });
  });
}

/* ── Modal ───────────────────────────────────────────────────── */
function openModal(lloji, id){
  if(lloji === 'mbyllje'){
    openMbyllje(id); return;
  }
  const isH  = lloji === 'hyrje';
  const pfx  = isH ? 'fh' : 'fd';
  const col  = isH ? 'var(--green,#1a9e6e)' : 'var(--accent)';
  const menyra = activeTab === 'cash' ? 'dore' : 'banke';
  const tabLabel = activeTab === 'cash' ? 'Cash' : 'Bankë';

  if(id){
    const x = DB.arka.find(a=>a.id===id); if(!x) return;
    editId = id; editLloji = lloji;
    const icon = isH ? 'ri-edit-line' : 'ri-edit-line';
    document.getElementById(`modal-${lloji}-title`).innerHTML =
      `<i class="ri-edit-line"></i> Edito ${isH?'Hyrjen':'Daljen'}`;
    document.getElementById(`${pfx}-pershkrim`).value = x.pershkrim||'';
    document.getElementById(`${pfx}-data`).value      = x.data||'';
    document.getElementById(`${pfx}-shuma`).value     = x.shuma||'';
    document.getElementById(`${pfx}-shuma`).style.color = x.shuma ? col : 'var(--text)';
    document.getElementById(`${pfx}-notes`).value     = x.notes||'';
    // Store the menyra from the entry (not overriding with tab)
    editLloji = lloji;
  } else {
    editId = null; editLloji = lloji;
    document.getElementById(`modal-${lloji}-title`).innerHTML =
      `<i class="${isH?'ri-arrow-down-circle-line':'ri-arrow-up-circle-line'}"></i> ${isH?'Hyrje':'Dalje'} ${tabLabel}`;
    document.getElementById(`${pfx}-pershkrim`).value = '';
    document.getElementById(`${pfx}-data`).value      = todayISO();
    document.getElementById(`${pfx}-shuma`).value     = '';
    document.getElementById(`${pfx}-shuma`).style.color = col;
    document.getElementById(`${pfx}-notes`).value     = '';
  }
  document.getElementById(`modal-${lloji}-bd`).classList.add('open');
  setTimeout(()=>document.getElementById(`${pfx}-pershkrim`).focus(), 80);
}

function openMbyllje(id){
  if(id){
    const x = DB.arka.find(a=>a.id===id); if(!x) return;
    editId = id; editLloji = 'mbyllje';
    document.getElementById('modal-mbyllje-title').innerHTML = '<i class="ri-edit-line"></i> Edito Mbylljen';
    document.getElementById('fm-pershkrim').value = x.pershkrim||'';
    document.getElementById('fm-data').value      = x.data||'';
    document.getElementById('fm-shuma').value     = x.shuma||'';
    document.getElementById('fm-shuma').style.color = x.shuma ? '#2563eb' : 'var(--text)';
    document.getElementById('fm-notes').value     = x.notes||'';
  } else {
    editId = null; editLloji = 'mbyllje';
    document.getElementById('modal-mbyllje-title').innerHTML = '<i class="ri-calendar-check-line"></i> Mbyllje Muaji';
    document.getElementById('fm-pershkrim').value = '';
    document.getElementById('fm-data').value      = todayISO();
    document.getElementById('fm-shuma').value     = '';
    document.getElementById('fm-shuma').style.color = '#2563eb';
    document.getElementById('fm-notes').value     = '';
  }
  document.getElementById('modal-mbyllje-bd').classList.add('open');
  setTimeout(()=>document.getElementById('fm-pershkrim').focus(), 80);
}

function closeModal(lloji){
  document.getElementById(`modal-${lloji}-bd`).classList.remove('open');
  editId = null; editLloji = null;
}

function saveArka(lloji){
  const isMb = lloji === 'mbyllje';
  const isH  = lloji === 'hyrje';
  const pfx  = isMb ? 'fm' : (isH ? 'fh' : 'fd');

  const pershkrim = document.getElementById(`${pfx}-pershkrim`).value.trim();
  if(!pershkrim){ toast('Shkruaj përshkrimin — e detyrueshme.'); document.getElementById(`${pfx}-pershkrim`).focus(); return; }
  const shuma = parseFloat(document.getElementById(`${pfx}-shuma`).value)||0;
  if(shuma<=0){ toast('Vendos shumën — e detyrueshme.'); document.getElementById(`${pfx}-shuma`).focus(); return; }
  const data  = document.getElementById(`${pfx}-data`).value||todayISO();
  const notes = document.getElementById(`${pfx}-notes`).value.trim();

  // menyra: mbyllje=null (always cash), others forced by tab unless editing existing
  let menyra;
  if(isMb){
    menyra = null;
  } else if(editId){
    // Keep existing menyra when editing
    const existing = DB.arka.find(a=>a.id===editId);
    menyra = existing ? (existing.menyra || (activeTab==='cash'?'dore':'banke')) : (activeTab==='cash'?'dore':'banke');
  } else {
    menyra = activeTab === 'cash' ? 'dore' : 'banke';
  }

  let list = DB.arka;
  if(editId){
    const idx = list.findIndex(a=>a.id===editId);
    if(idx>=0) list[idx] = {...list[idx], pershkrim, data, shuma, menyra, notes};
    toast(isMb ? 'Mbyllja u përditësua.' : `${isH?'Hyrja':'Dalja'} u përditësua.`);
  } else {
    list.push({id:genId(), lloji, pershkrim, data, shuma, menyra, notes, created:new Date().toISOString()});
    toast(isMb ? 'Mbyllja u shtua.' : `${isH?'Hyrja':'Dalja'} u shtua.`);
  }
  DB.arka = list;
  closeModal(lloji);
  renderList();
}

/* ── Delete ──────────────────────────────────────────────────── */
function askDel(id){ deleteId=id; document.getElementById('conf-bd').classList.add('open'); }
function closeConf(){ document.getElementById('conf-bd').classList.remove('open'); deleteId=null; }
function confirmDel(){
  if(!deleteId) return;
  DB.arka = DB.arka.filter(a=>a.id!==deleteId);
  closeConf(); toast('Veprimi u fshi.'); renderList();
}

/* ── Duplicate ───────────────────────────────────────────────── */
function dupArka(id){
  const x = DB.arka.find(a=>a.id===id); if(!x) return;
  const lloji = x.lloji;
  editId = null; editLloji = lloji;

  if(lloji === 'mbyllje'){
    document.getElementById('modal-mbyllje-title').innerHTML = '<i class="ri-file-copy-line"></i> Dubliko Mbylljen';
    document.getElementById('fm-pershkrim').value = x.pershkrim||'';
    document.getElementById('fm-data').value      = todayISO();
    document.getElementById('fm-shuma').value     = x.shuma||'';
    document.getElementById('fm-shuma').style.color = '#2563eb';
    document.getElementById('fm-notes').value     = x.notes||'';
    document.getElementById('modal-mbyllje-bd').classList.add('open');
    setTimeout(()=>document.getElementById('fm-shuma').focus(), 80);
    return;
  }
  const isH = lloji === 'hyrje';
  const pfx = isH ? 'fh' : 'fd';
  const col = isH ? 'var(--green,#1a9e6e)' : 'var(--accent)';
  const tabLabel = activeTab === 'cash' ? 'Cash' : 'Bankë';
  document.getElementById(`modal-${lloji}-title`).innerHTML =
    `<i class="ri-file-copy-line"></i> Dubliko ${isH?'Hyrjen':'Daljen'}`;
  document.getElementById(`${pfx}-pershkrim`).value = x.pershkrim||'';
  document.getElementById(`${pfx}-data`).value      = todayISO();
  document.getElementById(`${pfx}-shuma`).value     = x.shuma||'';
  document.getElementById(`${pfx}-shuma`).style.color = col;
  document.getElementById(`${pfx}-notes`).value     = x.notes||'';
  document.getElementById(`modal-${lloji}-bd`).classList.add('open');
  setTimeout(()=>document.getElementById(`${pfx}-shuma`).focus(), 80);
}

/* ── Render ──────────────────────────────────────────────────── */
function renderList(){
  const q = document.getElementById('search').value.toLowerCase();

  // Filter by tab
  let list = DB.arka.filter(x=>{
    if(activeTab === 'cash'){
      // Cash: mbyllje OR hyrje/dalje dorë (null also treated as dorë for backward compat)
      if(x.lloji === 'mbyllje') return true;
      if((x.menyra||'dore') !== 'dore') return false;
    } else {
      // Banka: only hyrje/dalje bankë
      if(x.lloji === 'mbyllje') return false;
      if((x.menyra||'dore') !== 'banke') return false;
    }
    return true;
  }).filter(x=>{
    if(typeFlt && x.lloji !== typeFlt) return false;
    if(!DP.matches(x.data)) return false;
    if(q && !(x.pershkrim||'').toLowerCase().includes(q)) return false;
    return true;
  });

  // Sort
  if(sortCol==='data')
    list.sort((a,b)=>{const da=new Date(a.data||a.created||0),db=new Date(b.data||b.created||0);return sortDir==='asc'?da-db:db-da;});
  else if(sortCol==='emertimi')
    list.sort((a,b)=>{const na=(a.pershkrim||'').toLowerCase(),nb=(b.pershkrim||'').toLowerCase();return sortDir==='asc'?na.localeCompare(nb):nb.localeCompare(na);});
  else if(sortCol==='shuma')
    list.sort((a,b)=>sortDir==='asc'?(a.shuma||0)-(b.shuma||0):(b.shuma||0)-(a.shuma||0));

  // Stats
  const mbylljeTotal = list.filter(x=>x.lloji==='mbyllje').reduce((s,x)=>s+(x.shuma||0),0);
  const hyrjeTotal   = list.filter(x=>x.lloji==='hyrje').reduce((s,x)=>s+(x.shuma||0),0);
  const daljeTotal   = list.filter(x=>x.lloji==='dalje').reduce((s,x)=>s+(x.shuma||0),0);

  let statsHtml;
  if(activeTab === 'cash'){
    const totalHyrje = mbylljeTotal + hyrjeTotal; // mbyllje + hyrje dorë
    const balanca    = totalHyrje - daljeTotal;
    statsHtml = `
      <div class="period-card"><div class="pc-header"><div class="pc-icon ${balanca>=0?'green':'red'}"><i class="ri-hand-coin-line"></i></div><span class="pc-label">Balanca Cash</span></div><div class="pc-val ${balanca>=0?'':'red'}">${fmtL(balanca)}</div></div>
      <div class="period-card"><div class="pc-header"><div class="pc-icon" style="background:#dbeafe"><i class="ri-calendar-check-line" style="color:#2563eb"></i></div><span class="pc-label">Mbyllje Muaji</span></div><div class="pc-val" style="color:#2563eb">${fmtL(mbylljeTotal)}</div></div>
      <div class="period-card"><div class="pc-header"><div class="pc-icon green"><i class="ri-arrow-down-circle-line"></i></div><span class="pc-label">Hyrje Cash</span></div><div class="pc-val" style="color:#1a9e6e">${fmtL(hyrjeTotal)}</div></div>
      <div class="period-card"><div class="pc-header"><div class="pc-icon red"><i class="ri-arrow-up-circle-line"></i></div><span class="pc-label">Dalje Cash</span></div><div class="pc-val red">${fmtL(daljeTotal)}</div></div>`;
  } else {
    const balanca = hyrjeTotal - daljeTotal;
    statsHtml = `
      <div class="period-card"><div class="pc-header"><div class="pc-icon ${balanca>=0?'green':'red'}"><i class="ri-bank-line"></i></div><span class="pc-label">Balanca Bankë</span></div><div class="pc-val ${balanca>=0?'':'red'}">${fmtL(balanca)}</div></div>
      <div class="period-card"><div class="pc-header"><div class="pc-icon green"><i class="ri-arrow-down-circle-line"></i></div><span class="pc-label">Hyrje Bankë</span></div><div class="pc-val" style="color:#1a9e6e">${fmtL(hyrjeTotal)}</div></div>
      <div class="period-card"><div class="pc-header"><div class="pc-icon red"><i class="ri-arrow-up-circle-line"></i></div><span class="pc-label">Dalje Bankë</span></div><div class="pc-val red">${fmtL(daljeTotal)}</div></div>
      <div class="period-card"><div class="pc-header"><div class="pc-icon blue"><i class="ri-list-check"></i></div><span class="pc-label">Nr. Veprimeve</span></div><div class="pc-val">${list.length}</div></div>`;
  }
  document.getElementById('stats-strip').innerHTML = statsHtml;

  const totalHyrjeCash = mbylljeTotal + hyrjeTotal;
  const balancaLabel   = activeTab==='cash' ? totalHyrjeCash - daljeTotal : hyrjeTotal - daljeTotal;
  document.getElementById('list-total').textContent = `${list.length} rekorde · Balanca: ${fmtL(balancaLabel)}`;

  const wrap = document.getElementById('list-wrap');
  if(!list.length){
    const emptyMsg = activeTab==='cash'
      ? 'Nuk ka veprime Cash.<br>Shtyp <strong>Mbyllje Muaji</strong>, <strong>Hyrje Cash</strong> ose <strong>Dalje Cash</strong>.'
      : 'Nuk ka veprime bankare.<br>Shtyp <strong>Hyrje Bankë</strong> ose <strong>Dalje Bankë</strong>.';
    wrap.innerHTML = `<div class="empty"><i class="ri-safe-line"></i>${emptyMsg}</div>`;
    return;
  }

  const si = col => sortCol===col
    ? `<span class="sort-arrow">${sortDir==='asc'?'↑':'↓'}</span>`
    : '<span class="sort-arrow muted">↕</span>';

  const rows = list.map(x=>{
    const isMb = x.lloji === 'mbyllje';
    const isH  = x.lloji === 'hyrje';
    const isDa = x.lloji === 'dalje';

    const iconCls   = isMb ? 'ri-calendar-check-line' : (isH ? 'ri-arrow-down-circle-line' : 'ri-arrow-up-circle-line');
    const iconColor = isMb ? '#2563eb' : (isH ? '#1a9e6e' : 'var(--accent)');
    const iconBg    = isMb ? '#dbeafe' : (isH ? '#1a9e6e18' : 'var(--accent-bg,#fee)');
    const amtColor  = isMb ? '#2563eb' : (isH ? '#1a9e6e' : 'var(--accent)');
    const amtSign   = isDa ? '−' : '+';
    const badgeCls  = isMb ? 'badge-mbyllje' : (isH ? 'paguar' : 'pa-paguar');
    const badgeLbl  = isMb ? 'Mbyllje' : (isH ? 'Hyrje' : 'Dalje');

    const editFn = isMb
      ? `openMbyllje('${x.id}')`
      : `openModal('${x.lloji}','${x.id}')`;

    return `<tr onclick="${editFn}" style="cursor:pointer;">
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:30px;height:30px;border-radius:7px;background:${iconBg};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i class="${iconCls}" style="font-size:15px;color:${iconColor}"></i>
          </div>
          <div class="td-name">${esc(x.pershkrim||'Pa përshkrim')}</div>
        </div>
      </td>
      <td>${x.data?fmtDate(x.data):'—'}</td>
      <td class="td-amt" style="color:${amtColor};">${amtSign}${fmtL(x.shuma)}</td>
      <td><span class="badge ${badgeCls}">${badgeLbl}</span></td>
      <td onclick="event.stopPropagation()">
        <div style="display:flex;gap:6px;justify-content:flex-end;">
          <button class="btn-icon" onclick="dupArka('${x.id}')" title="Dubliko"><i class="ri-file-copy-line"></i></button>
          <button class="btn-icon" onclick="${editFn};event.stopPropagation()" title="Edito"><i class="ri-edit-line"></i></button>
          <button class="btn-icon danger" onclick="askDel('${x.id}');event.stopPropagation()" title="Fshi"><i class="ri-delete-bin-line"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `<table>
    <thead><tr>
      <th class="th-sort" onclick="setSort('emertimi')">Përshkrimi ${si('emertimi')}</th>
      <th class="th-sort" onclick="setSort('data')">Data ${si('data')}</th>
      <th class="th-sort" onclick="setSort('shuma')">Shuma ${si('shuma')}</th>
      <th>Lloji</th>
      <th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

DP.onchange = renderList;

// Init tab from hash
const initTab = location.hash === '#banka' ? 'banka' : 'cash';
setTab(initTab);

document.addEventListener('click', e=>{
  ['ac-hyrje-dd','ac-dalje-dd','ac-mbyllje-dd'].forEach(id=>{
    const dd = document.getElementById(id);
    if(dd && !dd.closest('.ac-wrap').contains(e.target)) dd.classList.remove('open');
  });
});
</script>
